modules:
  # ---------- Screens ----------
  jira:issueContext:
    - key: kept-promises-panel
      resource: promises-panel
      resolver:
        function: resolver
      render: native
      title: Customer promises
      label: Customer promises
      dynamicProperties:
        function: request-badge
      displayConditions:
        jiraExpression: 'issue.project.projectTypeKey == "service_desk"'
    - key: kept-dev-panel
      resource: dev-panel
      resolver:
        function: resolver
      render: native
      title: Customers waiting
      label: Customers waiting
      dynamicProperties:
        function: dev-badge
      displayConditions:
        jiraExpression: 'issue.project.projectTypeKey != "service_desk"'
  jira:globalPage:
    - key: kept-global-page
      resource: dashboard
      resolver:
        function: resolver
      render: native
      title: Kept
  jiraServiceManagement:queuePage:
    - key: kept-queue-page
      resource: dashboard
      resolver:
        function: resolver
      render: native
      title: Customer promises
  jira:adminPage:
    - key: kept-settings
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Kept
  jiraServiceManagement:portalRequestDetail:
    - key: kept-portal
      resource: portal
      resolver:
        function: resolver
      render: native
      title: Fix progress
      unlicensedAccess:
        - customer
        - unlicensed

  # ---------- Rovo ----------
  rovo:agent:
    - key: kept-agent
      name: Kept
      description: Tracks promises support makes to customers about fixes, warns when the developer plan slips, and drafts honest customer updates.
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - Which customer promises are at risk this week?
        - Draft an update for the customer on this request
        - Find promises in this request's replies
        - Why is the fix for this request late?
      actions:
        - get-promise-context
        - list-promises-at-risk
        - find-promises-in-request
        - track-promise
        - post-customer-update
  action:
    - key: get-promise-context
      name: Get promise context
      function: rovo-get-promise-context
      actionVerb: GET
      description: >
        Returns the fix chain behind a Jira Service Management request: the request and customer, the linked developer
        work items with status, sprint, release and due date, and every promise made to the customer with its risk,
        expected fix date and plain-language reasons. Also works on a developer work item, returning the customers waiting on it.
      inputs:
        requestKey:
          title: Request or work item key
          type: string
          required: false
          description: The key, for example SUP-12. Leave empty to use the work item the user is looking at.
    - key: list-promises-at-risk
      name: List promises at risk
      function: rovo-list-promises-at-risk
      actionVerb: GET
      description: >
        Lists open customer promises that are at risk, broken, tight, or due within the next N days, with the customer,
        request key, promised date, expected fix date and the reason. Use it for questions like "which promises are at risk this week".
      inputs:
        days:
          title: Days ahead
          type: integer
          required: false
          description: How many days ahead to include promises that are due. Default 7.
        projectKey:
          title: Service space key
          type: string
          required: false
          description: Limit to one service space, for example SUP. Leave empty for all spaces.
    - key: find-promises-in-request
      name: Find promises in a request
      function: rovo-find-promises
      actionVerb: GET
      description: >
        Returns the public replies support agents posted on a request, with rule-based promise candidates (dates found next to
        commitments like "fixed by Friday") and the promise dates already tracked, so you can spot untracked promises.
      inputs:
        requestKey:
          title: Request key
          type: string
          required: false
          description: The request key, for example SUP-12. Leave empty to use the open request.
    - key: track-promise
      name: Track a promise
      function: rovo-track-promise
      actionVerb: CREATE
      description: >
        Starts tracking a promise made to a customer on a request: the date the fix was promised and what was said.
        Kept then checks it against the linked developer work and warns if the plan slips. Confirm the date with the user first.
      inputs:
        requestKey:
          title: Request key
          type: string
          required: true
          description: The service request key, for example SUP-12.
        promisedDate:
          title: Promised date
          type: string
          required: true
          description: The date the fix was promised, in YYYY-MM-DD form.
        promiseText:
          title: What was promised
          type: string
          required: false
          description: The sentence the promise came from.
        devIssueKey:
          title: Developer work item key
          type: string
          required: false
          description: The linked developer work item the fix depends on. Leave empty to use the first linked one.
    - key: post-customer-update
      name: Send customer update
      function: rovo-post-customer-update
      actionVerb: CREATE
      description: >
        Posts a reply that the customer can see on the request, as the signed-in agent, and records that the customer was
        updated. Optionally tracks a new promised date. Only call after the user approved the exact message.
      inputs:
        requestKey:
          title: Request key
          type: string
          required: true
          description: The service request key, for example SUP-12.
        message:
          title: Message
          type: string
          required: true
          description: The exact message the user approved. No internal details.
        newPromisedDate:
          title: New promised date
          type: string
          required: false
          description: A new date shared with the customer, in YYYY-MM-DD form. Kept tracks it as the new promise.

  # ---------- JQL: keptRisk, keptPromiseDate, keptWaiting, ... ----------
  jira:entityProperty:
    - key: kept-index
      entityType: issue
      propertyKey: kept
      values:
        - path: risk
          type: string
          searchAlias: keptRisk
        - path: rank
          type: number
          searchAlias: keptRank
        - path: promiseDate
          type: date
          searchAlias: keptPromiseDate
        - path: promises
          type: number
          searchAlias: keptPromises
        - path: waiting
          type: number
          searchAlias: keptWaiting
        - path: earliestPromise
          type: date
          searchAlias: keptEarliestPromise
        - path: atRisk
          type: number
          searchAlias: keptAtRisk

  # ---------- Background ----------
  trigger:
    - key: kept-issue-events
      function: on-issue-event
      events:
        - avi:jira:updated:issue
        - avi:jira:commented:issue
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
    - key: kept-link-events
      function: on-link-event
      events:
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
    - key: kept-sprint-events
      function: on-sprint-event
      events:
        - avi:jira-software:updated:sprint
        - avi:jira-software:closed:sprint
        - avi:jira-software:started:sprint
    - key: kept-version-events
      function: on-version-event
      events:
        - avi:jira:updated:version
        - avi:jira:released:version
        - avi:jira:unreleased:version
    - key: kept-lifecycle
      function: on-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  scheduledTrigger:
    - key: kept-hourly-sweep
      function: on-schedule
      interval: hour

  function:
    - key: resolver
      handler: index.resolver
    - key: request-badge
      handler: index.requestBadge
    - key: dev-badge
      handler: index.devBadge
    - key: on-issue-event
      handler: index.onIssueEvent
    - key: on-link-event
      handler: index.onLinkEvent
    - key: on-sprint-event
      handler: index.onSprintEvent
    - key: on-version-event
      handler: index.onVersionEvent
    - key: on-schedule
      handler: index.onSchedule
      timeoutSeconds: 300
    - key: on-lifecycle
      handler: index.onLifecycle
    - key: rovo-get-promise-context
      handler: index.getPromiseContext
    - key: rovo-list-promises-at-risk
      handler: index.listPromisesAtRisk
    - key: rovo-find-promises
      handler: index.findPromisesInRequest
    - key: rovo-track-promise
      handler: index.trackPromiseAction
    - key: rovo-post-customer-update
      handler: index.postCustomerUpdate

resources:
  - key: promises-panel
    path: src/frontend/promises-panel/index.tsx
  - key: dev-panel
    path: src/frontend/dev-panel/index.tsx
  - key: dashboard
    path: src/frontend/dashboard/index.tsx
  - key: admin
    path: src/frontend/admin/index.tsx
  - key: portal
    path: src/frontend/portal/index.tsx
  - key: agent-prompt
    path: resources/agent

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/11111111-1111-4111-8111-111111111111
  storage:
    entities:
      - name: promise
        attributes:
          id: { type: string }
          requestKey: { type: string }
          requestId: { type: string }
          projectKey: { type: string }
          devIssueKey: { type: string }
          customer: { type: string }
          promisedDate: { type: string }
          text: { type: string }
          source: { type: string }
          sourceCommentId: { type: string }
          madeBy: { type: string }
          madeAt: { type: string }
          state: { type: string }
          risk: { type: string }
          riskRank: { type: integer }
          expectedDate: { type: string }
          expectedSource: { type: string }
          reasons: { type: any }
          lastAlertedRisk: { type: string }
          customerToldAt: { type: string }
          history: { type: any }
          replacedBy: { type: string }
          replaces: { type: string }
          updatedAt: { type: string }
        indexes:
          - name: by-request
            partition:
              - requestKey
            range:
              - promisedDate
          - name: by-dev
            partition:
              - devIssueKey
            range:
              - promisedDate
          - name: by-state
            partition:
              - state
            range:
              - promisedDate
          - name: by-project-state
            partition:
              - projectKey
              - state
            range:
              - promisedDate

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - read:servicedesk-request
    - write:servicedesk-request
    - read:sprint:jira-software
    - write:sprint:jira-software
    - delete:sprint:jira-software
    - read:board-scope:jira-software
    - storage:app
